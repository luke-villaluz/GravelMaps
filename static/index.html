<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>GravelMaps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚙</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="glass">
    <div id="grabber" aria-hidden="true"></div>

    <div class="stops-card">
      <div id="stops"></div>
      <button id="swap" class="swap" title="Reverse route" aria-label="Reverse route">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4v13m0 0-3.5-3.5M7 17l3.5-3.5M17 20V7m0 0-3.5 3.5M17 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="stop-actions">
      <button id="add-via" class="text-btn">Add Stop</button>
      <button id="clear" class="text-btn">Clear</button>
    </div>

    <div class="section">
      <div id="profiles" class="segmented" role="tablist"></div>
    </div>

    <div class="section style">
      <div class="row-between">
        <span class="label">Route Style</span>
        <button id="apply-all" class="text-btn small" hidden>Apply to All Legs</button>
      </div>
      <div id="legs" class="leg-tabs" hidden></div>
      <div id="presets" class="chips"></div>
      <button id="customize" class="disclosure" aria-expanded="false">
        <span>Customize Road Types</span>
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="sliders" class="sliders" hidden></div>
    </div>

    <div id="status" hidden></div>

    <section id="result" hidden>
      <div class="summary">
        <div class="metric"><span id="sum-time" class="big"></span></div>
        <div class="metric-sub"><span id="sum-dist"></span> · <span id="sum-dirt"></span> unpaved</div>
      </div>
      <div id="bar" class="bar"></div>
      <div id="bar-legend" class="bar-legend"></div>
      <div id="elev" class="elev" hidden>
        <div class="elev-stats">
          <div><span id="el-gain" class="v"></span><span class="k">Climb</span></div>
          <div><span id="el-loss" class="v"></span><span class="k">Descent</span></div>
          <div><span id="el-max" class="v"></span><span class="k">High Point</span></div>
          <div><span id="el-grade" class="v"></span><span class="k">Max Grade</span></div>
        </div>
        <div class="elev-chart">
          <svg id="el-svg" aria-label="Elevation profile"></svg>
          <div id="el-tip" class="el-tip" hidden></div>
        </div>
      </div>
      <button id="gpx" class="tinted-btn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export GPX
      </button>
      <ol id="steps" class="list"></ol>
    </section>

    <p id="hint" class="footnote">Search above or tap the map to set a start and destination. Drag pins to adjust; tap the route to add a stop.</p>
    <p class="footnote" id="regions"></p>
  </aside>

  <div id="map-controls">
    <div id="basemaps" class="segmented glass small"></div>
    <div class="glass button-stack">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="locate-me" aria-label="Show my location">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M20.5 3.5 3.8 10.6l7 2.6 2.6 7z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div id="legend" class="glass"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
